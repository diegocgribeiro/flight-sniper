[project]
name = "flight-sniper-worker"
version = "0.1.0"
description = "Worker que varre preços no Google Flights (fast-flights) e alerta via Resend."
requires-python = ">=3.11"
dependencies = [
    "fast-flights==3.1.0",
    "typing_extensions>=4.12",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
flight-sniper = "flight_sniper.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/flight_sniper/alerts.py" = ["E501"]  # template HTML do e-mail
