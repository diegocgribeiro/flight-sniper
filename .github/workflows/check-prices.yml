name: check-prices

on:
  schedule:
    # Reserva: o `schedule` do GitHub atrasa horas ou pula execuções. O disparo
    # pontual vem do cron-job.org → /api/cron do site → workflow_dispatch.
    # Cada rota decide se está "na vez" pelo horário cadastrado, então disparos
    # extras não duplicam buscas.
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      route_id:
        description: "ID da rota (vazio = todas)"
        required: false
        default: ""
      force:
        description: "Ignorar agenda de horários"
        required: false
        default: "true"
      trigger:
        description: "Origem do disparo (manual/cron/new-route)"
        required: false
        default: "manual"

# Nunca duas varreduras ao mesmo tempo (evita duplicar buscas e alertas).
concurrency:
  group: check-prices
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/pyproject.toml

      - name: Instalar worker
        run: pip install ./worker

      - name: Varredura de preços
        working-directory: worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
          APP_URL: ${{ vars.APP_URL }}
          PYTHONIOENCODING: utf-8
          # Inputs via env (não interpolados no script) para evitar injeção de shell.
          EVENT: ${{ github.event_name }}
          IN_ROUTE_ID: ${{ inputs.route_id }}
          IN_FORCE: ${{ inputs.force }}
          IN_TRIGGER: ${{ inputs.trigger }}
        run: |
          ARGS=()
          if [ "$EVENT" = "workflow_dispatch" ]; then
            ARGS+=(--trigger "${IN_TRIGGER:-manual}")
            if [ -n "$IN_ROUTE_ID" ]; then
              [[ "$IN_ROUTE_ID" =~ ^[0-9]+$ ]] || { echo "route_id inválido"; exit 1; }
              ARGS+=(--route-id "$IN_ROUTE_ID")
            fi
            [ "$IN_FORCE" = "true" ] && ARGS+=(--force)
          fi
          python -m flight_sniper.main "${ARGS[@]}"

  # Workflows agendados em repositórios públicos são desativados após 60 dias
  # sem atividade; isto reativa o agendamento automaticamente.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
