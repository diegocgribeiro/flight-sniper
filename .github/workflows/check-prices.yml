name: check-prices

on:
  schedule:
    # De hora em hora (min. 7 para fugir do pico do minuto 0). Cada rota
    # decide se está "na vez" pelas faixas de horário cadastradas no site.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      route_id:
        description: "ID da rota (vazio = todas)"
        required: false
        default: ""
      force:
        description: "Ignorar agenda de horários"
        required: false
        default: "true"

# Nunca duas varreduras ao mesmo tempo (evita duplicar buscas e alertas).
concurrency:
  group: check-prices
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/pyproject.toml

      - name: Instalar worker
        run: pip install ./worker

      - name: Varredura de preços
        working-directory: worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
          APP_URL: ${{ vars.APP_URL }}
          PYTHONIOENCODING: utf-8
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS="--trigger manual"
            [ -n "${{ inputs.route_id }}" ] && ARGS="$ARGS --route-id ${{ inputs.route_id }}"
            [ "${{ inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          fi
          python -m flight_sniper.main $ARGS

  # Workflows agendados em repositórios públicos são desativados após 60 dias
  # sem atividade; isto reativa o agendamento automaticamente.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
